[tool.poetry]
name = "bank_widget"
version = "0.1.0"
description = "Банковский виджет для отображения операций клиента"
authors = ["Your Name <your.email@example.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.14"

[tool.poetry.group.lint.dependencies]
flake8 = "^6.0.0"
black = "^23.0.0"
isort = "^5.12.0"
mypy = "^1.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 119
exclude = '''
/(
  \.git
)/
'''

[tool.isort]
line_length = 119
multi_line_output = 3
force_single_line = true

[tool.mypy]
python_version = "3.9"
check_untyped_defs = true
disallow_untyped_defs = false
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
show_error_codes = true
explicit_package_bases = true
namespace_packages = false
mypy_path = "."

[[tool.mypy.overrides]]
module = "tests.*"
ignore_missing_imports = true
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = "test_*"
ignore_missing_imports = true
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = "requests.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "src.*"
ignore_missing_imports = false

[mypy-requests]
ignore_missing_imports = true

[project]
name = "bank_widget"
version = "0.1.0"
dependencies = [
    "requests>=2.28.0",
    "python-dotenv>=1.0.0",
    "pandas (>=2.3.3,<3.0.0)",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-mock>=3.10.0",
    "mypy>=1.0.0",
    "types-requests>=2.28.0",
]
